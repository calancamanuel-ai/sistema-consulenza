# Valori di partenza presi da docs/piano-consulenza-pmi.md.
# Da ritarare dopo le prime classifiche e dopo i primi contatti.

settori:
  # Voti da 1 a 5 con le prove (link).
  # base = somma(peso × voto) / somma(pesi) × 20, da 20 a 100; punteggio = base × moltiplicatore di rischio.
  # Voucher e incentivi esclusi (novembre 2026): non si sa cosa ci sarà nel 2027.
  # I nomi dei criteri sono anche le colonne di data/settori.csv.
  pesi:
    lavoro_ripetitivo: 25      # prenotazioni, promemoria, preventivi, risposte, documenti
    capacita_spesa: 15         # margini e scontrino tipici
    dimensione_mercato: 15     # attività indipendenti in Italia (campione Maps)
    potenziale_ricorrente: 10  # assistenza mensile, hosting, aggiornamenti
    facilita_contatto: 10      # titolare in sede, associazioni di categoria
    maturita_digitale: 10      # qualche strumento, nessuna automazione
    concorrenza: 5             # pochi fornitori in zona = voto alto
  moltiplicatore_rischio:
    normale: 1.0
    dati_sensibili: 0.8        # per esempio studi sanitari

opportunita:
  # Da quante recensioni su Maps vale il segnale molte_recensioni (lo calcola il codice).
  soglia_molte_recensioni: 100
  # Punti dei segnali della singola attività; il totale ordina le attività da contattare.
  punti:
    instagram_attivo: 2        # buon materiale e post regolari
    nessun_sito: 2             # vale solo se instagram_attivo
    sito_debole: 2             # sito vecchio o senza prenotazione o contatto rapido
    molte_recensioni: 1        # volume di clienti alto
    indipendente: 1
    catena: -3                 # franchising o catena
    prenotazione_moderna: -1   # già un sistema di prenotazione moderno e completo
    nessuna_presenza: -1       # nessuna presenza online e nessuna attività sui social
    scheda_non_reclamata: 2    # scheda Google mai rivendicata dal titolare
    scheda_trascurata: 1       # scheda rivendicata ma senza risposte alle recensioni né aggiornamenti
    scheda_incompleta: 1       # scheda senza orari o con meno di 10 foto
    lamentele_recensioni: 1    # almeno 2 delle ultime 10 recensioni lamentano attese, telefono, prenotazione
    sito_senza_privacy: 1      # sito senza informativa privacy o banner dei cookie
    pubblicita_attiva: 1       # inserzioni attive su Meta: c'è budget per il marketing
    solo_telefono: 1           # solo telefono fisso: niente WhatsApp, modulo o prenotazione online
  # Servizio da proporre quando il segnale conta; finisce nella colonna servizi del foglio.
  servizi:
    nessun_sito: sito vetrina con prenotazione online
    sito_debole: rifacimento del sito
    sito_senza_privacy: messa a norma privacy e cookie del sito
    scheda_non_reclamata: rivendicazione e configurazione della scheda Google
    scheda_trascurata: gestione della scheda Google e risposte alle recensioni
    scheda_incompleta: completamento della scheda Google (orari, foto)
    lamentele_recensioni: prenotazione online e promemoria automatici
    pubblicita_attiva: landing page e gestione delle campagne
    solo_telefono: WhatsApp Business con risposte e promemoria automatici
